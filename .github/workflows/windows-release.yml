# Builds the DevTrack Windows app on GitHub's Windows runners, which already
# include Visual Studio Build Tools and the Windows SDK.
#
# Output (workflow artifact): DevTrack.exe + DevTrackBackend.exe, ready to drop
# into the local MSIX working folder (store_release/msix_work_vX) and pack.
#
# Run it by pushing a version tag (e.g. `git push origin v0.1.6.0`) or, once
# this file is on the default branch, from the Actions tab ("Run workflow").

name: Windows release build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Install Python dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run backend tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # The backend bundles frontend/dist, so build the frontend first.
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build backend (PyInstaller)
        run: python -m PyInstaller DevTrackBackend.spec --noconfirm

      - name: Place backend sidecar for Tauri
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force frontend/src-tauri/binaries | Out-Null
          Copy-Item dist/DevTrackBackend.exe frontend/src-tauri/binaries/DevTrackBackend-x86_64-pc-windows-msvc.exe -Force

      - name: Build desktop app (Tauri)
        working-directory: frontend
        run: npx tauri build --no-bundle

      - name: Collect release files
        id: collect
        shell: pwsh
        run: |
          $version = (Get-Content frontend/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $name = "DevTrack-$version-windows-x64"
          New-Item -ItemType Directory -Force "out/$name" | Out-Null
          Copy-Item frontend/src-tauri/target/release/DevTrack.exe "out/$name/"
          Copy-Item dist/DevTrackBackend.exe "out/$name/"
          Get-ChildItem "out/$name" -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Set-Content "out/$name/SHA256SUMS.txt"
          Get-Content "out/$name/SHA256SUMS.txt"
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.name }}
          path: out/${{ steps.collect.outputs.name }}
          if-no-files-found: error
          retention-days: 30
