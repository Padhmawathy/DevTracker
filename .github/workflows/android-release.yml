# Builds the DevTrack Android app (APK) on GitHub's Linux runners.
#
# The phone app keeps its data on the phone; there is no backend to bundle.
# Output (workflow artifact), both signed with the upload key from the secrets:
#   DevTrack-<version>-android.apk  install directly on a phone
#   DevTrack-<version>-android.aab  upload to Google Play Console
#
# Required secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64   the release keystore (.p12), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD its password
# Always sign with the same key: Android only installs an update over the
# existing app (keeping its data) when the signature matches.

name: Android release build

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      NDK_VERSION: "27.2.12479018"
      BUILD_TOOLS: "35.0.0"

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and build tools
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" "build-tools;${BUILD_TOOLS}" "platforms;android-35"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test the phone data engine
        working-directory: frontend
        run: npm run test:mobile

      - name: Create the Android project
        working-directory: frontend
        run: npx tauri android init --ci

      # Same progress-ring logo as the desktop app.
      - name: Generate app icons
        working-directory: frontend
        run: npx tauri icon src-tauri/icons/source/devtrack-icon.svg

      - name: Build APK and app bundle
        working-directory: frontend
        run: npx tauri android build --apk --aab --target aarch64 --ci

      - name: Sign APK and app bundle
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")
          name="DevTrack-${version}-android"
          mkdir -p out
          outputs=frontend/src-tauri/gen/android/app/build/outputs
          unsigned=$(find "$outputs/apk" -name '*release*.apk' | head -n 1)
          bundle=$(find "$outputs/bundle" -name '*release*.aab' | head -n 1)
          echo "Built: $unsigned and $bundle"
          tools="$ANDROID_HOME/build-tools/${BUILD_TOOLS}"
          "$tools/zipalign" -f -p 4 "$unsigned" out/aligned.apk

          if [ -z "${KEYSTORE_BASE64}" ] || [ -z "${KEYSTORE_PASSWORD}" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              echo "::notice::No signing key available here; the build was checked but not signed."
              echo "name=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Add ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository secrets."
            exit 1
          fi

          echo "${KEYSTORE_BASE64}" | base64 --decode > "$RUNNER_TEMP/release.p12"
          "$tools/apksigner" sign \
            --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 \
            --ks-pass env:KEYSTORE_PASSWORD \
            --out "out/${name}.apk" out/aligned.apk
          # The app bundle is signed with jarsigner, which needs the key alias.
          alias=$(keytool -list -v -storetype PKCS12 -keystore "$RUNNER_TEMP/release.p12" \
            -storepass:env KEYSTORE_PASSWORD | sed -n 's/^Alias name: //p' | head -n 1)
          cp "$bundle" "out/${name}.aab"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -storetype PKCS12 -keystore "$RUNNER_TEMP/release.p12" \
            -storepass:env KEYSTORE_PASSWORD "out/${name}.aab" "$alias"
          rm -f "$RUNNER_TEMP/release.p12" out/aligned.apk
          "$tools/apksigner" verify --print-certs "out/${name}.apk" | grep -E "Signer #1 certificate (DN|SHA-256)"
          jarsigner -verify "out/${name}.aab" | tail -n 1
          (cd out && sha256sum "${name}.apk" "${name}.aab" > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        if: steps.sign.outputs.name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sign.outputs.name }}
          path: out/
          if-no-files-found: error
          retention-days: 30
